server:
  port: ${PORT:29506}

spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:mem:app;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}"
    driver-class-name: "${SPRING_DATASOURCE_DRIVER:org.h2.Driver}"
    username: "${DB_USER:sa}"
    password: "${DB_PASSWORD:}"
  jpa:
    database-platform: "${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}"
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath*:db/init.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.generated.ldesportsbar.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.generated.ldesportsbar.mapper: DEBUG
